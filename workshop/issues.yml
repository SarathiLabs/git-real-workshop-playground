- key: phase-timeline
  title: 'Add a phase timeline to presentation mode'
  labels: ['workshop', 'area:ui', 'difficulty:intermediate', 'phase:collaboration']
  body: |
    The current phase is a single badge. There is no sense of where the session
    started or how far it has come.

    **Done when**
    - Presentation mode shows all phases with the current one marked
    - Completed phases look different from upcoming ones
    - It is legible from the back of a lecture hall

    **Where to look**
    `src/components/layout/app-shell.tsx`, `src/data/workshop.json`

- key: first-contribution-badge
  title: 'Mark first-time contributors'
  labels: ['workshop', 'area:ui', 'difficulty:starter', 'phase:open-source']
  body: |
    For a lot of people in this room, the pull request they open today is the
    first one of their life. That is worth marking.

    **Done when**
    - Somebody's first merged pull request is visibly marked
    - The marker disappears once they have more than one

    **Where to look**
    `src/utils/aggregate-participant.ts`, `src/data/achievements.json`
