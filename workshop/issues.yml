- key: graph-team-clustering
  title: 'Cluster graph nodes by team'
  labels: ['workshop', 'area:graph', 'difficulty:advanced', 'phase:collaboration']
  body: |
    With forty teams the graph is a uniform cloud. Teams should be visually
    grouped so the shape of the organisation is readable from the back of a room.

    **Done when**
    - Members of a team sit near each other
    - Cross-team review edges are the visually interesting thing, because they cross gaps
    - It still lays out in under a second with sixty nodes

    **Where to look**
    `src/utils/build-graph-model.ts`

- key: graph-performance
