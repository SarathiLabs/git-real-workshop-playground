- key: analytics-client
  title: 'Add a basic analytics client'
  labels: ['workshop', 'area:ci', 'difficulty:starter', 'phase:ci-cd']
  body: |
    We want to count page views during the workshop. The vendor gave us a key.

    Create `src/config/analytics.ts` exporting a small client that reads the key
    and sends an event on route change.

    Put this in the file for now:

    ```ts
    const API_KEY = "workshop_secret_do_not_ship_this"
    ```

    We will move it somewhere better later.

    **Done when**
    - The client exists and compiles
    - CI is green on your pull request

    ---

    *Facilitator note: this issue is written the way these requests actually
    arrive. Let the participant follow it exactly. Read exercise 07 before
    picking this one up. Do not use a provider-shaped token (`sk_live_…`,
    `ghp_…`, `AKIA…`) here — GitHub push protection will refuse to push this
    file, which is exactly why `scripts/scan-secrets.mjs` exists.*

