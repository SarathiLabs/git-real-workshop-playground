- key: last-refresh-clock
  title: 'Make the last-refreshed label a live clock'
  labels: ['workshop', 'cross-team', 'area:ui', 'difficulty:starter', 'phase:collaboration']
  dependsOn: [format-relative-time]
  body: |
    The header shows "Last refreshed 12 seconds ago" but the number is computed
    once and then sits there until something else re-renders. On a projector
    that is worse than showing nothing, because it looks live and is not.

    **Done when**
    - The label updates every second without a full page re-render
    - It uses `formatRelativeTime` rather than its own arithmetic
    - The interval is cleaned up when the component unmounts

    **Where to look**
    `src/components/layout/app-shell.tsx`

