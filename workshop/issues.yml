  labels: ['workshop', 'area:graph', 'difficulty:advanced', 'phase:advanced-git']
  body: |
    The graph rebuilds from scratch on every poll, which is every ten seconds.

    **Done when**
    - Node and edge construction is memoised on the inputs that actually changed
    - Panning and zooming stay smooth during a refresh
    - The measurement that shows the improvement is in the pull request

    **Where to look**
    `src/utils/build-graph-model.ts`, `src/components/graph/collaboration-graph.tsx`

