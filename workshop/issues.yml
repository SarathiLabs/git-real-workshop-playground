- key: dark-mode
  title: 'Enable dark mode'
  labels: ['workshop', 'good first issue', 'area:ui', 'difficulty:starter', 'phase:fundamentals']
  body: |
    Dark mode is fully implemented, and the toggle is hidden.

    It stays hidden until **both** `features.darkMode` and `ENABLE_THEME_SWITCHER`
    are true. Flipping one of them does nothing, which is deliberate: a feature
    guarded by two flags is a real pattern, and it is a good reason to read a
    file properly before changing it.

    **Done when**
    - The toggle appears in the header
    - Both themes look right, including the graph and the badges
    - You have actually looked at every page in dark mode

    **Where to look**
    `src/config/features.ts`, `src/components/layout/theme-toggle.tsx`

