- key: wire-up-oxlint
  title: 'oxlint is configured but never runs'
  labels: ['workshop', 'area:ci', 'difficulty:starter', 'phase:ci-cd']
  body: |
    `.oxlintrc.json` exists, `oxlint` is installed, and nothing invokes it. Dead
    configuration is worse than none, because people assume it is protecting them.

    **Done when**
    - Either oxlint runs as part of `npm run lint` and CI, or the config and the
      dependency are removed
    - Whichever you choose, the reasoning is in the pull request

    **Where to look**
