# Workshop backlog.
#
# Seed these into GitHub with:  npm run seed:issues -- --dry-run
#                        then:  npm run seed:issues
#
# Fields
#   key         stable identifier used by dependsOn, never shown on GitHub
#   title       issue title
#   labels      applied as-is, so they must exist (npm run seed:labels)
#   dependsOn   list of keys that must be merged first; the seeder adds a
#               "Blocked by #N" line, the `blocked` label, and a comment on
#               the blocking issue so the link is visible from both sides
#   body        markdown
#
# The dependsOn pairs are the important part. They are what turns forty
# independent tasks into an organisation that has to talk to itself.

# ---------------------------------------------------------------------------
# Foundations. These block other work, so they go out first.
# ---------------------------------------------------------------------------

- key: format-relative-time
  title: 'Implement the formatRelativeTime utility'
  labels: ['workshop', 'cross-team', 'area:utils', 'difficulty:intermediate', 'phase:collaboration']
  body: |
    `src/utils/format-relative-time.ts` currently throws. Two other teams are
    waiting on it, so this one is worth picking up early.

    It turns a timestamp into something a human reads without doing arithmetic:
    `just now`, `3 minutes ago`, `2 hours ago`, `yesterday`, `12 Aug`.

    **Done when**
    - `describe.skip` in `src/utils/format-relative-time.test.ts` is unskipped and green
    - The function never throws on a malformed or future date
    - `npm test` passes

    **Where to look**
    `src/utils/format-relative-time.ts`, `src/utils/format-relative-time.test.ts`

    Two teams import this the moment it lands. Keep the signature as it is, and
    if you think it should change, say so on the pull request rather than just
    changing it.

- key: empty-state-component
  title: 'Build a shared EmptyState component'
  labels: ['workshop', 'cross-team', 'area:ui', 'difficulty:starter', 'phase:collaboration']
  body: |
    Several pages render nothing at all when they have no data, which looks like
    a bug rather than an empty list.

    `src/components/ui/empty-state.tsx` is a stub. Make it a real component with
    an icon, a title, an optional description, and an optional action slot.

    **Done when**
    - The component renders in both light and dark themes
    - It follows the same conventions as the other primitives in `src/components/ui/`
    - Two other teams can import it without changing it

    **Where to look**
    `src/components/ui/empty-state.tsx`, and any other file in `src/components/ui/` as a reference.

    The skipped tests in `src/components/ui/empty-state.test.tsx` are the contract.
    Unskip them, then make them pass.

- key: sort-teams-activity
  title: 'Sort teams by commits, pull requests, and reviews'
  labels: ['workshop', 'cross-team', 'area:utils', 'area:tests', 'difficulty:starter', 'phase:fundamentals']
  body: |
    `sortTeams` in `src/utils/sort-teams.ts` only handles `name`. The other three
    keys silently return the list unchanged, so the dropdown on the Teams page
    looks broken.

    The tests are already written. They are skipped so that `main` stays green.

    **Done when**
    - `describe.skip` becomes `describe` in `src/utils/sort-teams.test.ts`
    - All four sort keys work, highest count first
    - `sortTeams` does not mutate the array it is given

    **Where to look**
    `src/utils/sort-teams.ts`

    Watch the Test check on your pull request go red the moment you unskip, then
    green when you implement. That is the whole point of this one.

- key: collaboration-score-rebalance
  title: 'Rebalance the collaboration score'
  labels: ['workshop', 'cross-team', 'area:utils', 'difficulty:intermediate', 'phase:code-review']
  body: |
    `calculateCollaborationScore` weights commits at 5 and reviews at 2, which
    says that typing is worth more than reading somebody else's work. For a
    workshop about collaboration that is the wrong message, and the number ends
    up rewarding whoever committed most often.

    **Done when**
    - Reviews are worth more than commits
    - Cross-team reviews are worth more than same-team reviews
    - The existing tests in `src/utils/collaboration-score.test.ts` are updated to match
    - The reasoning for your weights is written in the pull request description

    **Where to look**
    `src/utils/collaboration-score.ts`

    There is no single right answer here. Defend your numbers in the pull request.

